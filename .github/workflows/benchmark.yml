name: benchmark

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede a pull request's own runs, but let a push to main finish: every
# run measures two commits and cancelling one throws away the pair.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    # Only run on main / manual dispatch, or on pull requests tagged "benchmark".
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 30   # every run benchmarks two commits, ~4 min each
    env:
      # Pull requests run the small/medium default sizes, main and manual
      # dispatch the full tail. Both runs need the same sizes to compare.
      BENCH_FLAGS: ${{ github.event_name != 'pull_request' && 'bench:full' || '' }}
    strategy:
      matrix:
        python-version: [ "3.14" ]
    steps:
    - name: Name the artifact after the branch
      id: branch
      env:
        REF: ${{ github.head_ref || github.ref_name }}
      run: echo "slug=${REF//\//-}" >> "$GITHUB_OUTPUT"
    - name: Resolve the commit to compare against
      id: previous
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BEFORE_SHA: ${{ !github.event.created && github.event.before || '' }}
        GH_TOKEN: ${{ github.token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REPO: ${{ github.repository }}
      run: |
        # A pull request is measured against its merge base: the head does
        # not contain what landed on main since it forked, so the tip of the
        # base branch would charge it for everyone else's commits. A push to
        # main is measured against the branch before it; a manual dispatch
        # and a newly created branch have nothing to compare against.
        if [ -n "$BASE_SHA" ]; then
          sha="$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" \
            --jq .merge_base_commit.sha)"
        else
          sha="$BEFORE_SHA"
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
    - name: Prepare PR metadata
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PREV_SHA: ${{ steps.previous.outputs.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RUN_ID: ${{ github.run_id }}
      run: |
        mkdir -p "$RUNNER_TEMP/benchmark-comment"
        printf '{"pull_request":%s,"base":"%s","previous":"%s","head":"%s","run_id":%s}\n' \
          "$PR_NUMBER" "$BASE_SHA" "$PREV_SHA" "$HEAD_SHA" "$RUN_ID" \
          > "$RUNNER_TEMP/benchmark-comment/metadata.json"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ steps.previous.outputs.sha || github.sha }}
        persist-credentials: false
    - name: Setup uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install
      run:
        uv sync --locked --group dev
    - name: Benchmark the previous commit
      if: steps.previous.outputs.sha != ''
      run:
        uv run pytest benchmark/ -v
          --benchmark-json="$RUNNER_TEMP/previous.json"
    - name: Checkout the head commit
      if: steps.previous.outputs.sha != ''
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - name: Install the head commit
      if: steps.previous.outputs.sha != ''
      # Checkout deletes the generated version module, so rebuild the project.
      run:
        uv sync --locked --group dev --reinstall-package discopy
    - name: Benchmark the head commit
      run: |
        mkdir -p benchmark-results
        uv run pytest benchmark/ -v \
          --benchmark-json=benchmark-results/bench.json
    - name: Render the report for the head commit
      env:
        PREV_SHA: ${{ steps.previous.outputs.sha }}
      run:
        uv run python benchmark/report.py benchmark-results/bench.json
          --output benchmark-results
          ${PREV_SHA:+--base "$RUNNER_TEMP/previous.json"}
    - name: Summarise the comparison
      # A regression is a warning, never a failure: the runner is shared, so
      # an unrelated case can cross the threshold on noise alone.
      if: steps.previous.outputs.sha != ''
      run: |
        cat benchmark-results/comparison.md >> "$GITHUB_STEP_SUMMARY"
        if grep -q '^\*\*WARNING:' benchmark-results/comparison.md; then
          echo "::warning::Important benchmark regressions, see the summary."
        fi
    - name: Stage the comparison for the comment
      if: github.event_name == 'pull_request'
      run:
        cp benchmark-results/comparison.md "$RUNNER_TEMP/benchmark-comment/"
        || true
    - name: Upload PR comment data
      if: always() && github.event_name == 'pull_request'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: benchmark-comment
        path: ${{ runner.temp }}/benchmark-comment/
        retention-days: 1
    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: benchmark-results-${{ steps.branch.outputs.slug }}
        path: benchmark-results/
