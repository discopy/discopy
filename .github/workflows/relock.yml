name: relock
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
    - run: uv lock
    - run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add uv.lock
        git commit -m "Update uv.lock for the tensor extra" || echo "lockfile unchanged"
        git push
