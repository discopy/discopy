name: no-todo-on-main
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
    - name: Generate a discopy-bot token
      id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ vars.DISCOPY_BOT_APP_ID }}
        private-key: ${{ secrets.DISCOPY_BOT_PRIVATE_KEY }}
        permission-pull-requests: write

    - name: Enforce the TODO state
      env:
        ACTION: ${{ github.event.action }}
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
        BEFORE_SHA: ${{ github.event.before }}
        GH_TOKEN: ${{ github.token }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        IS_DRAFT: ${{ github.event.pull_request.draft }}
        NODE_ID: ${{ github.event.pull_request.node_id }}
      run: |
        todo_at() {
          gh api "repos/$HEAD_REPO/git/trees/$1" --jq '
            if .truncated == false then
              any(.tree[]; .path == "TODO.md" and .type == "blob")
            else error("tree response truncated") end'
        }
        set_draft() {
          local mutation="$1" expected="$2" result
          result="$(GH_TOKEN="$APP_TOKEN" gh api graphql -f id="$NODE_ID" -f query="
            mutation(\$id: ID!) {
              $mutation(input: {pullRequestId: \$id}) {
                pullRequest { isDraft }
              }
            }" --jq ".data.$mutation.pullRequest.isDraft")" || return 1
          [ "$result" = "$expected" ]
        }

        current="$(todo_at "$HEAD_SHA")" || exit 1
        if [ "$current" = true ]; then
          if [ "$IS_DRAFT" = false ]; then
            set_draft convertPullRequestToDraft true || exit 1
            echo "::notice::TODO.md is present — pull request is now draft."
          fi
          exit 0
        fi

        if [ "$ACTION" = synchronize ] && [ "$IS_DRAFT" = true ]; then
          previous="$(todo_at "$BEFORE_SHA")" || exit 1
          if [ "$previous" = true ]; then
            set_draft markPullRequestReadyForReview false || exit 1
            echo "::notice::TODO.md was deleted — pull request is now ready."
          fi
        fi
