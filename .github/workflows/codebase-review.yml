name: codebase-review
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model override, empty for CODEBASE_REVIEW_MODEL
        required: false
        default: ""
      dry_run:
        description: Write the report to the run summary, post nothing
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  issues: read
concurrency:
  group: codebase-review
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Check the configuration
      id: config
      env:
        BASE_URL: ${{ vars.CODEBASE_REVIEW_BASE_URL }}
        MODEL: ${{ vars.CODEBASE_REVIEW_MODEL }}
        KEY: ${{ secrets.CODEBASE_REVIEW_API_KEY }}
      run: |
        if [ -n "$BASE_URL" ] && [ -n "$MODEL" ] && [ -n "$KEY" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::codebase-review is not configured — set the \
        CODEBASE_REVIEW_BASE_URL and CODEBASE_REVIEW_MODEL variables and \
        the CODEBASE_REVIEW_API_KEY secret."
          echo "configured=false" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/checkout@v4
      if: steps.config.outputs.configured == 'true'
      with:
        fetch-depth: 0

    - name: Setup uv
      if: steps.config.outputs.configured == 'true'
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install the package
      if: steps.config.outputs.configured == 'true'
      run: uv sync --locked --dev --group all

    - name: Read the codebase
      if: steps.config.outputs.configured == 'true'
      uses: anthropics/claude-code-action@v1
      env:
        GH_TOKEN: ${{ github.token }}
        ANTHROPIC_BASE_URL: ${{ vars.CODEBASE_REVIEW_BASE_URL }}
      with:
        anthropic_api_key: ${{ secrets.CODEBASE_REVIEW_API_KEY }}
        github_token: ${{ github.token }}
        prompt: Follow the instructions in .github/codebase-review/prompt.md.
        claude_args: >-
          --allowedTools "Bash(uv sync:*),Bash(uv run:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh search:*),Bash(git log:*),Bash(git diff:*),Read,Write,Glob,Grep"
          --max-turns 400
          --model ${{ inputs.model || vars.CODEBASE_REVIEW_MODEL }}

    - name: Summarise the dry run
      if: steps.config.outputs.configured == 'true' && inputs.dry_run
      run: |
        {
          echo "## Dry run — nothing posted"
          echo
          if [ -s .codebase-review/report.md ]; then
            cat .codebase-review/report.md
          else
            echo "*The read left no \`.codebase-review/report.md\` — see the"
            echo "\"Read the codebase\" step above for what the agent did"
            echo "instead.*"
          fi
          echo
          cat .codebase-review/bugs.md 2>/dev/null || true
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Generate a discopy-bot token
      id: app-token
      if: steps.config.outputs.configured == 'true' && !inputs.dry_run
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ vars.DISCOPY_BOT_APP_ID }}
        private-key: ${{ secrets.DISCOPY_BOT_PRIVATE_KEY }}
        permission-issues: write

    - name: Post the findings
      if: steps.config.outputs.configured == 'true' && !inputs.dry_run
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
        REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{
          github.repository }}/actions/runs/${{ github.run_id }}
      run: python3 .github/codebase-review/post.py
