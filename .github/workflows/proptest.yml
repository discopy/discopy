name: proptest

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proptest:
    # Pull requests opt in with the "proptest" label.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'proptest')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: ./.github/actions/setup
      with:
        python-version: "3.14"
    - name: Run property tests
      run:
        uv run pytest proptest/ -n auto -p no:benchmark -vrxX
