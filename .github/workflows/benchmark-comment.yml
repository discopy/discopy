name: benchmark-comment

on:
  workflow_run:
    workflows: [benchmark]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Download the comparison
      # A run cancelled before staging anything leaves no artifact, which is
      # nothing to post; the script tells that from a download that failed,
      # by asking whether the artifact is there at all.
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: benchmark-comment
        path: benchmark-comment
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}
    - name: Post or update the comparison
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/benchmark_comment.py
