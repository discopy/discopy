name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede a pull request's own runs, but let every commit on main keep the
# run that proves it green: cancelling those leaves main with commits nothing
# ever built, as it did on 112b6036.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: ./.github/actions/setup
      with:
        python-version: "3.14"
    - name: actionlint
      env:
        VERSION: 1.7.9
        SCRIPTS: https://raw.githubusercontent.com/rhysd/actionlint
      run: |
        curl -fsSL "$SCRIPTS/v$VERSION/scripts/download-actionlint.bash" \
          | bash -s -- "$VERSION"
        ./actionlint -color
    - name: Check for errors
      run:
        uv run pflake8 .github
    - name: Test
      run:
        uv run --with pyyaml pytest --import-mode=importlib .github/tests/*.py
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # backstop: green runs take ~6 min; a job wedged on its first network step reports nothing for hours (#591)
    strategy:
      matrix:
        python-version: [ "3.14" ]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: ./.github/actions/setup
      with:
        python-version: ${{ matrix.python-version }}
    - name: Check for errors
      run:
        # stop the build if there are Python syntax errors or undefined names
        uv run pflake8 discopy
    - name: pylint
      run:
        uv run pylint discopy
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: [ "3.12", "3.13", "3.14" ]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: ./.github/actions/setup
      with:
        python-version: ${{ matrix.python-version }}
        groups: dev all
        graphviz: 'true'
    - name: Test
      run:
        uv run coverage run -m pytest
    - name: Coverage
      run:
        uv run coverage report --show-missing
    - name: Test notebooks
      run:
        # Execute every marimo notebook and fail if any cell errors.
        uv run python docs/export_notebooks.py --check
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: [ "3.14" ]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: ./.github/actions/setup
      with:
        python-version: ${{ matrix.python-version }}
        groups: docs
        graphviz: 'true'
    - name: Build
      run: |
        uv run sphinx-build docs docs/_build/html
    - name: Upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: docs
        path: docs/_build/html
