name: build

on:
  push:
    branches:
      - 'main'
      - 'tooling/uv-migration'
  pull_request:

# Cancel superseded runs so only the latest pipeline runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SRC_DIR: discopy
  TEST_DIR: test
  DOCS_DIR: docs

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # backstop: green runs take ~6 min; a job wedged on its first network step reports nothing for hours (#591)
    strategy:
      matrix:
        python-version: [ "3.14" ]
    steps:
    - uses: actions/checkout@v4
    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install linter
      run:
        uv sync --locked --group dev
    - name: Check for errors
      run:
        # stop the build if there are Python syntax errors or undefined names
        uv run pflake8 discopy
    - name: pylint
      run:
        uv run pylint discopy
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: [ "3.12", "3.13", "3.14" ]
    steps:
    - uses: actions/checkout@v4
    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Graphviz
      # A stalled mirror can trickle bytes past any apt read timeout (#591),
      # so bound each call by wall clock and retry once on a fresh connection.
      timeout-minutes: 10
      run: |
        APT="sudo timeout 120 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10"
        $APT update && $APT install -y graphviz \
          || { $APT update && $APT install -y graphviz; }
        dot -V
    - name: Install
      run:
        uv sync --locked --group dev --group all
    - name: Test
      run:
        uv run coverage run -m pytest
    - name: Coverage
      run:
        uv run coverage report --show-missing
    - name: Test notebooks
      run:
        # Execute every marimo notebook and fail if any cell errors.
        uv run python docs/export_notebooks.py --check
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: [ "3.14" ]
    steps:
    - uses: actions/checkout@v4
    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Graphviz
      # A stalled mirror can trickle bytes past any apt read timeout (#591),
      # so bound each call by wall clock and retry once on a fresh connection.
      timeout-minutes: 10
      run: |
        APT="sudo timeout 120 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10"
        $APT update && $APT install -y graphviz \
          || { $APT update && $APT install -y graphviz; }
        dot -V
    - name: Install
      run:
        uv sync --locked --group docs
    - name: Build
      run: |
        uv run sphinx-build ${{ env.DOCS_DIR }} ${{ env.DOCS_DIR }}/_build/html
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: docs
        path: ${{ env.DOCS_DIR }}/_build/html
